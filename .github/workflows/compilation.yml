# Compile MoodleSync.exe (Windows) et MoodleSync.app (Mac Apple Silicon) sur des machines de GitHub,
# les essaie et les publie comme artefacts. Sur une etiquette vX.Y, cree en plus la Release.
name: Compilation

on:
  push:
    branches: [main, macos]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: python -m pip install selenium sv-ttk pyinstaller pillow

      - name: Compilation
        run: pyinstaller --noconfirm --clean MoodleSync.spec

      - name: Essai de lancement
        # Sans reglages, le mode automatique doit demarrer puis s'arreter faute de jeton (code 1).
        timeout-minutes: 2
        run: |
          set +e
          sortie=$(dist/MoodleSync.app/Contents/MacOS/MoodleSync --auto 2>&1)
          code=$?
          echo "$sortie"; echo "code de sortie : $code"
          [ "$code" = 1 ] && ! echo "$sortie" | grep -q Traceback

      - name: Essai HTTPS
        # Avec un faux jeton, Moodle doit repondre "session expiree" : la connexion TLS a donc abouti.
        # Les certificats du Python de compilation sont retires, comme sur un Mac sans Python,
        # ou le .app les chercherait en vain.
        timeout-minutes: 2
        run: |
          set +e
          ca=$(python -c "import ssl; print(ssl.get_default_verify_paths().openssl_cafile)")
          echo "certificats de compilation : $ca ; SSL_CERT_FILE=${SSL_CERT_FILE:-vide}"
          unset SSL_CERT_FILE SSL_CERT_DIR
          sudo mv "$ca" "$ca.cache" 2>/dev/null
          d="$HOME/Library/Application Support/MoodleSync"
          mkdir -p "$d"
          echo '{"site": "https://moodle.unil.ch", "token": "jeton-factice"}' > "$d/config.json"
          sortie=$(dist/MoodleSync.app/Contents/MacOS/MoodleSync --auto 2>&1)
          echo "$sortie"
          rm -rf "$d"
          sudo mv "$ca.cache" "$ca" 2>/dev/null
          echo "$sortie" | grep -q "session a expire"

      - name: Archive
        # ditto conserve les liens symboliques internes du .app, que zip casserait.
        run: ditto -c -k --keepParent dist/MoodleSync.app MoodleSync-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MoodleSync-macOS
          path: MoodleSync-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: python -m pip install selenium sv-ttk pyinstaller

      - name: Compilation
        run: pyinstaller --noconfirm --clean MoodleSync.spec

      - name: Essai de lancement
        # Sans reglages, le mode automatique doit demarrer puis s'arreter faute de jeton (code 1).
        timeout-minutes: 2
        shell: pwsh
        run: |
          $p = Start-Process dist\MoodleSync.exe -ArgumentList "--auto" -Wait -PassThru
          "code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 1) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: MoodleSync-Windows
          path: dist/MoodleSync.exe

  release:
    # Uniquement sur une etiquette vX.Y : publie les deux executables, le mode d'emploi et les notes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - uses: softprops/action-gh-release@v2
        with:
          name: MoodleSync ${{ github.ref_name }}
          body_path: docs/notes-version.md
          files: |
            artefacts/MoodleSync-Windows/MoodleSync.exe
            artefacts/MoodleSync-macOS/MoodleSync-macOS.zip
            docs/LISEZ-MOI.txt
